name: Backend TypeScript Check

on:
  push:
    branches: [main, feat/flutter-firebase-rebuild]
    paths:
      - "backend/**"
      - ".github/workflows/backend-typescript.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-typescript.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
